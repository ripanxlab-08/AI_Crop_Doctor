name: ai_crop_doctor
description: AI-powered crop disease detection mobile app with G0-G3 stage-based treatment.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10+1

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

